<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clubs de Sports</title>
<link rel="stylesheet"
	href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="Style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet"
	href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

</head>
<body>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<nav class="navbar navbar-expand-lg navbar-custom fixed-top">
		<div class="container-fluid">
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarText"
				aria-controls="navbarText" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarText">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link" href="/">⚽
							Accueil</a></li>
					<li class="nav-item"><a class="nav-link" href="propos.html">ℹ️ À
							Propos</a></li>
					<li class="nav-item"><a class="nav-link" href="/publications">
							📰 Actualités des clubs</a></li>
				</ul>
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link"
						href="authentification.jsp">Connexion</a></li>
					<li class="nav-item"><a class="nav-link"
						href="inscription.html">Inscription</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container-fluid g-0 px-2 pt-2">
		<div class="row g-2">

			<div class="col-12 col-md-3">
				<div id="sidebar" class="bg-white border rounded p-3">

					<h6 class="fw-semibold mb-3">Filtres</h6>

					<div class="mb-3">
						<label for="selectFederation" class="form-label small">Fédération</label>
						<select id="selectFederation" class="form-select form-select-sm">
							<option value="">Toutes les fédérations</option>
						</select>
					</div>

					<hr class="my-2">
					<p class="text-muted small mb-2">Recherche par zone</p>

					<div class="mb-2">
						<label for="inputCodePostal" class="form-label small">Nom
							Commune</label> <input type="text" id="inputCodePostal"
							class="form-control form-control-sm" placeholder="ex : Rouen">
					</div>

					<div class="mb-3">
						<label for="selectRegion" class="form-label small">Ou
							région</label> <select id="selectRegion"
							class="form-select form-select-sm">
							<option value="">Choisir une région...</option>
						</select>
					</div>
					<button id="btnRechercher" class="btn btn-primary btn-sm w-100">
						Rechercher</button>
					<hr class="my-2">
					<p class="text-muted small mb-2">Ou recherche par rayon</p>

					<div class="mb-3">
						<label for="sliderRayon" class="form-label small"> Rayon :
							<span id="labelRayon" class="fw-semibold">25</span> km
						</label> <input type="range" id="sliderRayon" class="form-range" min="25"
							max="70" step="1" value="35">
					</div>
					<br>
					<br>
					<button id="btn-geoloc" class="btn btn-primary btn-sm w-100">
						Rechercher au tour de moi</button>
					<p id="compteurResultats" class="text-muted small text-center mt-2"></p>

				</div>
			</div>
			<div class="col-12 col-md-6">
				<div class="card p-0 overflow-hidden">
					<div id="map"></div>
				</div>
			</div>
			<div class="col-12 col-md-3">
				<div class="card">
					<h6 class="fw-semibold mb-3">Résultat des recherches</h6>
					<div id="listeClubs" class="mt-3"></div>

				</div>
			</div>
		</div>
	</div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script
		src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
	<script src="index.js"></script>
</body>
</html>
